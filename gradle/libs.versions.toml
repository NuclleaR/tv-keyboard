[versions]
agp = "9.4.1"
kotlin = "2.4.21"
sdk-compile = "37"
sdk-min = "23"
jvm-toolchain = "21"
jvm-bytecode = "17"
ktlint-core = "1.8.0"

[libraries]
compose-bom = "androidx.compose:compose-bom:2026.09.00"
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
coroutines-core = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
tv-material = "androidx.tv:tv-material:1.1.0"
junit = "junit:junit:4.13.2"
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
robolectric = "org.robolectric:robolectric:4.17"
androidx-test-junit = "androidx.test.ext:junit:1.3.0"
ktlint-compose = "io.nlopez.compose.rules:ktlint:0.6.8"

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "io.github.usefulness.ktlint-gradle-plugin", version = "0.14.0" }
